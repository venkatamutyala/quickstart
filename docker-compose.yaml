services:
  db-postgres:
    image: postgres:18.4@sha256:8ff36f3c66371cba71d20ceedccfc3de9669a68737607888c4ef0af93abe8e39
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?missing — run 'make init' to create .env from .env.example}
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C"
    volumes:
      # Postgres 18+ images store data in a version-specific subdir; mount the
      # whole /var/lib/postgresql (not /var/lib/postgresql/data).
      - pgdata:/var/lib/postgresql
    ports:
      - "${PGPORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-appdb}"]
      interval: 3s
      timeout: 3s
      retries: 15

  pgadmin:
    image: dpage/pgadmin4:9.15@sha256:cefc4cc6b7d9d71a9e81e76fb9d7e14038ab5661b539a190eea1b63fa612589a
    depends_on:
      db-postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?missing — run 'make init' to create .env from .env.example}
      # The pre-configured server gets its password from this env var, read at
      # connect time by the PasswordExecCommand in servers.json. This avoids a
      # mounted pgpass file: pgAdmin's workers run as uid 5050 and can't read a
      # host-owned 0600 pgpass (and libpq rejects any looser perms).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?missing — run 'make init' to create .env from .env.example}
      # Desktop (single-user) mode — fits this local-dev quickstart: no login or
      # master-password prompt, and it enables PasswordExecCommand (blocked in
      # multi-user server mode without an extra opt-in flag).
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      # The auto-login desktop user must match the account the image creates
      # from PGADMIN_DEFAULT_EMAIL (else pgAdmin 401s looking for its default
      # pgadmin4@pgadmin.org user). Quoted so it lands as a Python string.
      PGADMIN_CONFIG_DESKTOP_USER: "'${PGADMIN_EMAIL:-admin@example.com}'"
      # Desktop mode is normally gated by a per-launch key the desktop runtime
      # injects; without it every request 401s. Setting the key empty disables
      # that gate so the browser can reach pgAdmin directly.
      PGADMIN_INT_KEY: ""
      # Re-import servers.json on every boot so it stays the source of truth.
      # pgAdmin's /var/lib/pgadmin is a persisted anonymous volume and it skips
      # re-importing existing servers, so without this a stale server definition
      # survives config changes across restarts.
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: "True"
      # Trust the X-Forwarded-* headers set by a single reverse proxy (e.g. a
      # dev tunnel / Codespaces port-forward). Without this pgAdmin compares the
      # browser's tunnel-host Referer against its own localhost view and rejects
      # the request with "The referrer does not match the host."
      PGADMIN_CONFIG_PROXY_X_FOR_COUNT: "1"
      PGADMIN_CONFIG_PROXY_X_PROTO_COUNT: "1"
      PGADMIN_CONFIG_PROXY_X_HOST_COUNT: "1"
      PGADMIN_CONFIG_PROXY_X_PORT_COUNT: "1"
      PGADMIN_CONFIG_PROXY_X_PREFIX_COUNT: "1"
    ports:
      - "${PGADMIN_PORT:-8080}:80"
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro

  # S3-compatible object storage. Secrets come from .env (env vars), not garage.toml.
  s3-garage:
    image: dxflrs/garage:v2.3.0@sha256:866bd13ed2038ba7e7190e840482bc27234c4afaf77be8cfa439ae088c1e4690
    command: /garage server
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?missing — run 'make init' to create .env from .env.example}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?missing — run 'make init' to create .env from .env.example}
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garagemeta:/var/lib/garage/meta
      - garagedata:/var/lib/garage/data
    ports:
      - "${GARAGE_S3_PORT:-3900}:3900"     # S3 API
      - "${GARAGE_WEB_PORT:-3902}:3902"    # static website serving
      - "${GARAGE_ADMIN_PORT:-3903}:3903"  # admin API
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Web UI for Garage (talks to the admin API).
  s3-garage-ui:
    image: khairul169/garage-webui:1.1.0@sha256:17c793551873155065bf9a022dabcde874de808a1f26e648d4b82e168806439c
    depends_on:
      s3-garage:
        condition: service_healthy
    environment:
      API_BASE_URL: "http://s3-garage:3903"
      API_ADMIN_KEY: ${GARAGE_ADMIN_TOKEN:?missing — run 'make init' to create .env from .env.example}
      S3_ENDPOINT_URL: "http://s3-garage:3900"
      S3_REGION: ${GARAGE_REGION:-garage}
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
    ports:
      - "${GARAGE_UI_PORT:-3909}:3909"

  # Redis-compatible in-memory cache/store. Auth via the built-in 'default' user.
  cache-valkey:
    image: valkey/valkey:8.1-alpine@sha256:77643d152547b446fc15cbafaff22004545663fcd40c6b28038ad283837baa75
    # --requirepass enables auth; --appendonly yes persists to the data volume.
    command:
      - valkey-server
      - --requirepass
      - ${VALKEY_PASSWORD:?missing — run 'make init' to create .env from .env.example}
      - --appendonly
      - "yes"
    volumes:
      - valkeydata:/data
    ports:
      - "${VALKEY_PORT:-6379}:6379"
    healthcheck:
      # --no-auth-warning keeps the password off stderr; the exit code is what counts.
      test: ["CMD", "valkey-cli", "-a", "${VALKEY_PASSWORD:?missing — run 'make init' to create .env from .env.example}", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Web UI for Valkey (redis-commander, MIT). Use the upstream author's GitHub
  # Container Registry build: it's multi-arch (amd64 + arm64), so it runs
  # natively on Apple Silicon. The Docker Hub rediscommander/redis-commander
  # image is amd64-only and stale, which broke `make up` on arm64.
  cache-valkey-ui:
    image: ghcr.io/joeferner/redis-commander:latest@sha256:1ad484c1fc0a3b4072dfa2bb10d44f0eba8ecb342c8c0f9e17cb21a6557e4b7e
    depends_on:
      cache-valkey:
        condition: service_healthy
    environment:
      REDIS_HOST: cache-valkey
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${VALKEY_PASSWORD:?missing — run 'make init' to create .env from .env.example}
    ports:
      - "${VALKEY_UI_PORT:-8081}:8081"

  # AMQP message broker. The -management image bundles the management web UI.
  queue-rabbitmq:
    image: rabbitmq:4.1-management-alpine@sha256:c27a1e0a4f4a4486aeaa4c3c30f1d9b7211e06d341f005e5fca9ce36d95024bb
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-rabbit}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?missing — run 'make init' to create .env from .env.example}
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"               # AMQP
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"  # management web UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12

  # Event-streaming broker. Apache's own image (not Confluent's community edition),
  # single-node KRaft mode — no ZooKeeper. Plaintext, no auth (local-dev only), so no
  # secret to enforce. Topics are created on `make up` by scripts/kafka-init.sh.
  stream-kafka:
    image: apache/kafka:4.2.1@sha256:9916d60eca5d599550e2c320230808fda342124ba550bb4ac4ea8591803262a0
    environment:
      # --- single-node KRaft (combined broker + controller) ---
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Two client listeners so both contexts get a correct advertised address:
      #   INTERNAL — other containers reach the broker as 'stream-kafka:9092'
      #   EXTERNAL — host clients reach it via the published port as 'localhost:${KAFKA_PORT}'
      # A single advertised address can't serve both (clients reconnect to whatever the
      # broker advertises), hence the split. EXTERNAL binds 29092 inside the container and
      # is published on the host as ${KAFKA_PORT}.
      KAFKA_LISTENERS: CONTROLLER://:9093,INTERNAL://:9092,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://stream-kafka:9092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # --- single-node sizing: every replication factor must be 1 (one broker) ---
      # Without these the internal topics default to RF=3 and consumer groups /
      # transactions / exactly-once fail to start on a single node.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      # Auto-create a topic on first produce/consume (convenient for local dev). New topics
      # default to 1 partition; default.replication.factor is pinned to 1 since RF>1 is
      # impossible on a single node. Pre-create specific topics via scripts/kafka-init.sh
      # (KAFKA_TOPICS in .env), or have your app declare them with the AdminClient.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
      # Cap the broker heap (it otherwise defaults to ~1G) so the local stack and CI have a
      # predictable footprint; 512m is ample for single-node dev load.
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"
      # Default log dir is /tmp (ephemeral) — point it at the named volume so data persists.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafkadata:/var/lib/kafka/data
    ports:
      - "${KAFKA_PORT:-9092}:29092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 45s

  # Web UI for Kafka (kafbat/kafka-ui, Apache-2.0 — the actively-maintained successor to
  # provectus/kafka-ui, which has been dormant since its last release in Apr 2024, continued
  # by the original maintainers). Talks to the broker over the compose network.
  stream-kafka-ui:
    image: kafbat/kafka-ui:v1.5.0@sha256:7cda86a33344160309fdb65146332e4da65db81a945614f2fe32e210803f6fd1
    depends_on:
      stream-kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: stream-kafka:9092
      # DYNAMIC_CONFIG_ENABLED deliberately left off: the cluster is pre-wired here, and the
      # runtime-config write surface it opens is the class of kafbat's past unauth RCE — not
      # worth enabling for a UI that browses topics/consumer groups out of the box.
    ports:
      - "${KAFKA_UI_PORT:-8082}:8080"

  # Search / analytics engine. Single-node, security plugin DISABLED — plaintext http
  # with no auth (local-dev only), so no secret to enforce. single-node discovery also
  # skips the production bootstrap checks (e.g. vm.max_map_count).
  search-opensearch:
    image: opensearchproject/opensearch:3.6.0@sha256:b5dd1512af2a99748c942cfbbd7f32162623336b210667d0fc6333c6321f171d
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms${OPENSEARCH_HEAP:-512m} -Xmx${OPENSEARCH_HEAP:-512m}"
    ulimits:
      # memlock unlimited is required by bootstrap.memory_lock; nofile per OpenSearch docs.
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearchdata:/usr/share/opensearch/data
    ports:
      - "${OPENSEARCH_PORT:-9200}:9200"
    healthcheck:
      # Wait for yellow-or-better. A fresh node is green (system indices use 0 replicas); it
      # only goes yellow once an index is created with the default 1 replica (which can't be
      # assigned on a single node) — so accepting yellow keeps it healthy either way.
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s' >/dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 45s

  # Web UI for OpenSearch (OpenSearch Dashboards, Apache-2.0 — the first-party dashboard).
  # Security plugin disabled to match the engine's plaintext, no-auth setup.
  search-opensearch-ui:
    image: opensearchproject/opensearch-dashboards:3.6.0@sha256:1ddd64e3a07fd98bc20ccf5174760b51795630a602b81102b37d1e9ee82cb7a9
    depends_on:
      search-opensearch:
        condition: service_healthy
    environment:
      OPENSEARCH_HOSTS: '["http://search-opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    ports:
      - "${OPENSEARCH_DASHBOARDS_PORT:-5601}:5601"

  # On-demand debug box: every backend's native CLI, preloaded and joined to the compose
  # network. NOT started by `make up` (profile-gated) and removed on exit — launch it with
  # `make debug`. It's the stack's only locally-built image (see debug/Dockerfile); the base
  # is digest-pinned and downloaded binaries are checksum-verified. No connection detail is
  # hardcoded: `env_file` pulls in .env and the `environment` block below pre-wires each
  # client to the in-Docker hostnames (the same ones `make conn` prints) so the CLIs connect
  # with zero/minimal args.
  debug:
    profiles: ["debug"]
    build:
      context: ./debug
    image: quickstart-debug:local
    env_file: .env
    environment:
      # Postgres — psql/pg_dump auto-connect via libpq's PG* vars
      PGHOST: db-postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-appdb}
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:?missing — run 'make init' to create .env from .env.example}
      # S3 (Garage) — aws targets the endpoint; mc gets a ready 'garage' alias via MC_HOST_*
      AWS_ENDPOINT_URL: http://s3-garage:3900
      AWS_REGION: ${GARAGE_REGION:-garage}
      AWS_ACCESS_KEY_ID: ${GARAGE_ACCESS_KEY_ID:?missing — run 'make init' to create .env from .env.example}
      AWS_SECRET_ACCESS_KEY: ${GARAGE_SECRET_ACCESS_KEY:?missing — run 'make init' to create .env from .env.example}
      MC_HOST_garage: http://${GARAGE_ACCESS_KEY_ID}:${GARAGE_SECRET_ACCESS_KEY}@s3-garage:3900
      # Valkey — redis-cli reads the password from REDISCLI_AUTH (still pass -h cache-valkey)
      REDISCLI_AUTH: ${VALKEY_PASSWORD:?missing — run 'make init' to create .env from .env.example}
      # Kafka — bootstrap address for kcat and the kafka-*.sh tools
      KAFKA_BOOTSTRAP: stream-kafka:9092
      # RabbitMQ — AMQP URL for amqp-tools; user/pass for the management API
      RABBITMQ_USER: ${RABBITMQ_USER:-rabbit}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?missing — run 'make init' to create .env from .env.example}
      AMQP_URL: amqp://${RABBITMQ_USER:-rabbit}:${RABBITMQ_PASSWORD}@queue-rabbitmq:5672/%2F
      # OpenSearch — REST endpoint for curl
      OPENSEARCH_URL: http://search-opensearch:9200
    command: ["bash", "-l"]

volumes:
  pgdata:
  garagemeta:
  garagedata:
  valkeydata:
  rabbitmqdata:
  kafkadata:
  opensearchdata:
