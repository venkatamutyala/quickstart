services:
  db-postgres:
    image: postgres:18.4@sha256:8ff36f3c66371cba71d20ceedccfc3de9669a68737607888c4ef0af93abe8e39
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?missing — run 'make init' to create .env from .env.example}
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C"
    volumes:
      # Postgres 18+ images store data in a version-specific subdir; mount the
      # whole /var/lib/postgresql (not /var/lib/postgresql/data).
      - pgdata:/var/lib/postgresql
    ports:
      - "${PGPORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-appdb}"]
      interval: 3s
      timeout: 3s
      retries: 15

  pgadmin:
    image: dpage/pgadmin4:9.15@sha256:cefc4cc6b7d9d71a9e81e76fb9d7e14038ab5661b539a190eea1b63fa612589a
    depends_on:
      db-postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?missing — run 'make init' to create .env from .env.example}
      # The pre-configured server gets its password from this env var, read at
      # connect time by the PasswordExecCommand in servers.json. This avoids a
      # mounted pgpass file: pgAdmin's workers run as uid 5050 and can't read a
      # host-owned 0600 pgpass (and libpq rejects any looser perms).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?missing — run 'make init' to create .env from .env.example}
      # Desktop (single-user) mode — fits this local-dev quickstart: no login or
      # master-password prompt, and it enables PasswordExecCommand (blocked in
      # multi-user server mode without an extra opt-in flag).
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      # The auto-login desktop user must match the account the image creates
      # from PGADMIN_DEFAULT_EMAIL (else pgAdmin 401s looking for its default
      # pgadmin4@pgadmin.org user). Quoted so it lands as a Python string.
      PGADMIN_CONFIG_DESKTOP_USER: "'${PGADMIN_EMAIL:-admin@example.com}'"
      # Desktop mode is normally gated by a per-launch key the desktop runtime
      # injects; without it every request 401s. Setting the key empty disables
      # that gate so the browser can reach pgAdmin directly.
      PGADMIN_INT_KEY: ""
      # Re-import servers.json on every boot so it stays the source of truth.
      # pgAdmin's /var/lib/pgadmin is a persisted anonymous volume and it skips
      # re-importing existing servers, so without this a stale server definition
      # survives config changes across restarts.
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: "True"
      # Trust the X-Forwarded-* headers set by a single reverse proxy (e.g. a
      # dev tunnel / Codespaces port-forward). Without this pgAdmin compares the
      # browser's tunnel-host Referer against its own localhost view and rejects
      # the request with "The referrer does not match the host."
      PGADMIN_CONFIG_PROXY_X_FOR_COUNT: "1"
      PGADMIN_CONFIG_PROXY_X_PROTO_COUNT: "1"
      PGADMIN_CONFIG_PROXY_X_HOST_COUNT: "1"
      PGADMIN_CONFIG_PROXY_X_PORT_COUNT: "1"
      PGADMIN_CONFIG_PROXY_X_PREFIX_COUNT: "1"
    ports:
      - "${PGADMIN_PORT:-8080}:80"
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro

  # S3-compatible object storage. Secrets come from .env (env vars), not garage.toml.
  s3-garage:
    image: dxflrs/garage:v2.3.0@sha256:866bd13ed2038ba7e7190e840482bc27234c4afaf77be8cfa439ae088c1e4690
    command: /garage server
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?missing — run 'make init' to create .env from .env.example}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?missing — run 'make init' to create .env from .env.example}
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garagemeta:/var/lib/garage/meta
      - garagedata:/var/lib/garage/data
    ports:
      - "${GARAGE_S3_PORT:-3900}:3900"     # S3 API
      - "${GARAGE_WEB_PORT:-3902}:3902"    # static website serving
      - "${GARAGE_ADMIN_PORT:-3903}:3903"  # admin API
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Web UI for Garage (talks to the admin API).
  s3-garage-ui:
    image: khairul169/garage-webui:1.1.0@sha256:17c793551873155065bf9a022dabcde874de808a1f26e648d4b82e168806439c
    depends_on:
      s3-garage:
        condition: service_healthy
    environment:
      API_BASE_URL: "http://s3-garage:3903"
      API_ADMIN_KEY: ${GARAGE_ADMIN_TOKEN:?missing — run 'make init' to create .env from .env.example}
      S3_ENDPOINT_URL: "http://s3-garage:3900"
      S3_REGION: ${GARAGE_REGION:-garage}
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
    ports:
      - "${GARAGE_UI_PORT:-3909}:3909"

  # Redis-compatible in-memory cache/store. Auth via the built-in 'default' user.
  cache-valkey:
    image: valkey/valkey:8.1-alpine@sha256:77643d152547b446fc15cbafaff22004545663fcd40c6b28038ad283837baa75
    # --requirepass enables auth; --appendonly yes persists to the data volume.
    command:
      - valkey-server
      - --requirepass
      - ${VALKEY_PASSWORD:?missing — run 'make init' to create .env from .env.example}
      - --appendonly
      - "yes"
    volumes:
      - valkeydata:/data
    ports:
      - "${VALKEY_PORT:-6379}:6379"
    healthcheck:
      # --no-auth-warning keeps the password off stderr; the exit code is what counts.
      test: ["CMD", "valkey-cli", "-a", "${VALKEY_PASSWORD:?missing — run 'make init' to create .env from .env.example}", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Web UI for Valkey (redis-commander, MIT). Use the upstream author's GitHub
  # Container Registry build: it's multi-arch (amd64 + arm64), so it runs
  # natively on Apple Silicon. The Docker Hub rediscommander/redis-commander
  # image is amd64-only and stale, which broke `make up` on arm64.
  cache-valkey-ui:
    image: ghcr.io/joeferner/redis-commander:latest@sha256:1ad484c1fc0a3b4072dfa2bb10d44f0eba8ecb342c8c0f9e17cb21a6557e4b7e
    depends_on:
      cache-valkey:
        condition: service_healthy
    environment:
      REDIS_HOST: cache-valkey
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${VALKEY_PASSWORD:?missing — run 'make init' to create .env from .env.example}
    ports:
      - "${VALKEY_UI_PORT:-8081}:8081"

  # AMQP message broker. The -management image bundles the management web UI.
  queue-rabbitmq:
    image: rabbitmq:4.1-management-alpine@sha256:c27a1e0a4f4a4486aeaa4c3c30f1d9b7211e06d341f005e5fca9ce36d95024bb
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-rabbit}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?missing — run 'make init' to create .env from .env.example}
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"               # AMQP
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"  # management web UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12

volumes:
  pgdata:
  garagemeta:
  garagedata:
  valkeydata:
  rabbitmqdata:
