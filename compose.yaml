# quickstart — POC stack. `make up` runs everything for local dev.
# Profiles: (none)=core db+valkey · tools=pgadmin · observability=otel-lgtm · expose=traefik+autossh+socket-proxy
# Credentials come from .env (generate with `make init`). Backends bind to 127.0.0.1 only;
# they reach the internet ONLY through the `expose` profile's SSH tunnel.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro   # first-boot bootstrap only (NOT migrations)
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:7
    restart: unless-stopped
    command: ["valkey-server", "--requirepass", "${VALKEY_PASSWORD}", "--save", "60", "1"]
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD}
    volumes:
      - valkeydata:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$$VALKEY_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- STEP 1: enable your service ---------------------------------------------
  # `make add-service LANG=python NAME=app` copies a runnable recipe into services/<name>/
  # and (you) uncomment a block like recipes/<lang>/service.snippet.yml here.
  # app:
  #   build: ./services/app
  #   restart: unless-stopped
  #   env_file: .env
  #   environment:
  #     OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}   # `make up` sets this to false
  #   depends_on:
  #     db: { condition: service_healthy }
  #     valkey: { condition: service_healthy }
  #   healthcheck:
  #     test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #   labels:                                            # picked up by Traefik under `make expose`
  #     - traefik.enable=true
  #     - "traefik.http.routers.app.rule=Host(`app.${EXPOSE_HOST}`)"
  #     - traefik.http.routers.app.entrypoints=websecure
  #     - traefik.http.routers.app.tls.certresolver=le
  #     - traefik.http.services.app.loadbalancer.server.port=8000
  # -----------------------------------------------------------------------------

  pgadmin:
    image: dpage/pgadmin4:8.14
    profiles: ["tools"]
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: "True"
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    user: root   # so the entrypoint can read the bind-mounted pgpass and fix perms
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./pgadmin/pgpass:/pgadmin4/pgpass            # generated by `make init` (mode 600)
      - pgadmindata:/var/lib/pgadmin
    ports:
      - "8080:80"
    depends_on:
      db: { condition: service_healthy }

  lgtm:
    image: grafana/otel-lgtm:0.11.4
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
    volumes:
      - lgtm-data:/data
    ports:
      - "127.0.0.1:3000:3000"   # Grafana UI
      - "127.0.0.1:4317:4317"   # OTLP gRPC
      - "127.0.0.1:4318:4318"   # OTLP HTTP

  # --- Exposure (profile: expose) — needs a bare VPS; see vps/ + `make expose` ---------
  # Restricted Docker API for Traefik (never the raw socket).
  dockerproxy:
    image: tecnativa/docker-socket-proxy:0.3
    profiles: ["expose"]
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      NETWORKS: 1
      SERVICES: 1
      TASKS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # Local ingress: TLS (real Let's Encrypt via TLS-ALPN-01) + label-based routing.
  traefik:
    # v3.7+ required: older Traefik defaults its Docker client to API v1.24, which Docker
    # Engine 25+ (MinAPIVersion 1.40) rejects with "client version 1.24 is too old".
    image: traefik:v3.7
    profiles: ["expose"]
    restart: unless-stopped
    command: ["--configFile=/etc/traefik/traefik.yml"]
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - traefik-acme:/letsencrypt
    depends_on:
      dockerproxy: { condition: service_started }
    # No host ports: the SSH tunnel forwards VPS:443 -> traefik:443 over the compose network.

  # Holds the reverse tunnel to the bare VPS. Auth via your forwarded ssh-agent (no key file).
  autossh:
    image: jnovack/autossh:2.0.1
    profiles: ["expose"]
    restart: always
    environment:
      SSH_AUTH_SOCK: /ssh-agent
    entrypoint: ["autossh"]
    command:
      - "-M"
      - "0"
      - "-N"
      - "-o"
      - "StrictHostKeyChecking=accept-new"
      - "-o"
      - "ServerAliveInterval=30"
      - "-o"
      - "ServerAliveCountMax=3"
      - "-o"
      - "ExitOnForwardFailure=yes"
      - "-R"
      - "0.0.0.0:443:traefik:443"
      - "-R"
      - "0.0.0.0:5432:db:5432"
      - "-R"
      - "0.0.0.0:6379:valkey:6379"
      - "${TUNNEL_VPS_USER:-root}@${TUNNEL_VPS_HOST:-vps.invalid}"
    volumes:
      # Linux: $SSH_AUTH_SOCK. Docker Desktop (mac/win): /run/host-services/ssh-auth.sock
      - ${SSH_AUTH_SOCK:-/dev/null}:/ssh-agent
    depends_on:
      traefik: { condition: service_started }
    healthcheck:
      test: ["CMD", "sh", "-c", "pgrep autossh >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
  valkeydata:
  pgadmindata:
  lgtm-data:
  traefik-acme:
