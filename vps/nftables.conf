#!/usr/sbin/nft -f
# Bare-VPS firewall. SSH (22) open to all so you can't lock yourself out of the box.
# Exposed app/DB ports (443/5432/6379) reachable ONLY from IPs in the @allowlist set,
# which `make allow/deny` mutates live (and persists to /etc/nftables.d/allowlist.nft).
flush ruleset

table inet filter {
  set allowlist {
    type ipv4_addr
    flags interval          # supports single IPs and CIDR ranges
  }

  chain input {
    type filter hook input priority 0; policy drop;
    iif "lo" accept
    ct state established,related accept
    ct state invalid drop
    ip protocol icmp accept
    ip6 nexthdr ipv6-icmp accept
    tcp dport 22 accept
    tcp dport { 443, 5432, 6379 } ip saddr @allowlist accept
  }

  chain forward { type filter hook forward priority 0; policy drop; }
  chain output  { type filter hook output  priority 0; policy accept; }
}

# Persistent allowlist entries (created/maintained by `make allow`/`make deny`).
include "/etc/nftables.d/allowlist.nft"
